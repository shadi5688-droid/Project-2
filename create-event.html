<!DOCTYPE html>

<head>
    <title>Create New Event | Campus Event (LIMU)</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
         <aside class="sidebar">

            <div class="brand">
                Campus Event<br>
                (LIMU)
            </div>

            <nav class="nav">

                <a class="active" href="event-management.html">
                    Events Management
                </a>

                <a href="volunteers.html">

                    Volunteers
                </a>

                <a href="users.html">
                    Users Management
                </a>

                <a href="announcements.html">
                    Announcements Management
                </a>

            </nav>

        </aside>



        <main class="main">

            <header class="topbar">


                <div class="admin-pill">
                    <span class="avatar">A</span>
                    Admin
                </div>

            </header>
            <div class="content">

                <div class="page-heading">

                    <div>
                        <p class="eyebrow">EVENT MANAGEMENT</p>

                        <h1>Create New Event</h1>

                        <p>Enter the event information below.</p>
                    </div>

                </div>


                <div class="card">

                    <form action="#">

                        <div class="form-grid">

                            <div class="form-group">

                                <label>Event Title</label>

                                <input
                                    class="field"
                                    type="text"
                                    placeholder="Enter event title"
                                >

                            </div>


                            <div class="form-group">

                                <label>Date</label>

                                <input
                                    class="field"
                                    type="date"
                                >

                            </div>


                            <div class="form-group">

                                <label>Time</label>

                                <input
                                    class="field"
                                    type="text"
                                    placeholder="e.g. 10:00 AM – 1:00 PM"
                                >

                            </div>


                            <div class="form-group">

                                <label>Location</label>

                                <input
                                    class="field"
                                    type="text"
                                    placeholder="Enter location"
                                >

                            </div>


                            <div class="form-group full">

                                <label>Description</label>

                                <textarea
                                    class="field"
                                    rows="4"
                                    placeholder="Write a short description"
                                ></textarea>

                            </div>


                            <div class="form-group">

                                <label>Volunteers Needed</label>

                                <input
                                    class="field"
                                    type="number"
                                    placeholder="Enter number"
                                >

                            </div>

                        </div>


                        <div class="form-actions">

                            <button class="btn" type="button">
                                Save Event
                            </button>

                        </div>


                    </form>

                </div>

            </div>
            <!-- Footer -->
            <footer class="footer">
                © Campus Event (LIMU) · 
            </footer>

        </main>

    </div>

</body>

</html>
