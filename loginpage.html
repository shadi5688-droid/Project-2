<!DOCTYPE html>

<head>
    <title> Login | Campus Event (LIMU)</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="brand">
                Campus Event<br>
                (LIMU)
            </div>

            <nav class="nav">
                <a href="index.html">
                    Home
                </a>

                <a class="active" href="loginpage.html">
                    Login
                </a>
            </nav>

        </aside>


        <main class="main">

            <div class="content">

                <div class="page-heading">
                    <div>
                        <p class="eyebrow">WELCOME</p>

                        <h1>Campus Event (LIMU)</h1>

                        <p>University Event Management System</p>
                    </div>
                </div>


                <div class="login-wrap card">

                    <h2> Login</h2>

                    <form id="loginForm">

                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                class="field"
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Enter your email"
                                autocomplete="username"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="password">Password</label>

                            <input
                                class="field"
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <p style="margin-top: 20px;">
                            <button class="btn" type="submit">
                                Login
                            </button>
                        </p>

                    </form>
                </div>

                

                
            </div>


            <!-- Footer -->
            <footer class="footer">
                © Campus Event (LIMU) 
            </footer>

        </main>

    </div>

</body>
</html>
